# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV.fetch("PGPASSWORD", "postgres") %>
  # O handshake GSSAPI é tentado antes do TLS e falha em servidor sem Kerberos,
  # gastando um round-trip por conexão. Nada aqui usa Kerberos.
  gssencmode: disable

development:
  <<: *default
  database: legacy_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
#
# O sufixo `TEST_ENV_NUMBER` dá a cada processo do parallel_tests o seu próprio
# banco: legacy_test, legacy_test2, ... Sem ele os processos disputariam o mesmo
# banco e a suíte ficaria intermitente.
test:
  <<: *default
  database: legacy_test<%= ENV["TEST_ENV_NUMBER"] %>

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file.
production:
  <<: *default
  # Sem `database`, `username` ou `host` aqui: em produção quem configura a
  # conexão é a DATABASE_URL, injetada pelo Coolify a partir do serviço
  # Postgres. Config escrita aqui venceria silenciosamente parte da URL.
  #
  # Solid Cache, Queue e Cable moram neste mesmo banco (ver
  # docs/deploy/coolify.md), então o pool precisa de folga além das threads do
  # Puma — senão o supervisor do Solid Queue disputa conexão com as requisições.
  max_connections: <%= ENV.fetch("RAILS_DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 4 } %>
