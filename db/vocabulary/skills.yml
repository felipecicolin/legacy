# Habilidades — taxonomia curada.
#
# É taxonomia, não tag livre. Tag livre produz "engenharia civil", "eng. civil"
# e "Engenharia Civil" como três coisas diferentes, e o matching entre
# voluntário e obra quebra em silêncio: ninguém vê a vaga que existe.
#
# A chave é estável e em inglês — ela vira identificador no banco. O rótulo em
# português vive em `config/locales/vocabulary/pt-BR.yml`, sob `skills.<key>`,
# e o nome da categoria sob `skill_categories.<category>`. Chave sem rótulo
# reprova em `spec/models/vocabulary/catalog_spec.rb`.
#
# `position` ordena a lista dentro da categoria, em passos de 10 para caber
# uma habilidade nova entre duas sem renumerar as outras. Empate dentro da
# mesma categoria reprova no mesmo spec: duas habilidades com a mesma posição
# fazem a ordem da tela depender do banco.
- { key: civil_engineering, category: engineering, position: 10 }
- { key: structural_engineering, category: engineering, position: 20 }
- { key: geotechnical_engineering, category: engineering, position: 30 }
- { key: hydraulic_engineering, category: engineering, position: 40 }
- { key: sanitation_engineering, category: engineering, position: 50 }
