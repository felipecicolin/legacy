# Países — ISO 3166-1.
#
# Fonte dos códigos: ISO 3166-1 alpha-2/alpha-3 e ISO 4217, extraídos da gem
# `countries` 8.1 (usada uma vez, na geração deste arquivo — não é dependência
# da aplicação). Os nomes em português NÃO moram aqui: a chave é o `iso_code`,
# estável e em inglês, e o rótulo vive em `config/locales/vocabulary/pt-BR.yml`,
# sob `countries.<iso_code em minúsculas>`. Traduzir para um segundo idioma
# passa a ser adicionar arquivo de locale, nunca migrar dado.
#
# `high_risk` é DADO EDITORIAL DA EQUIPE, e é o gancho que faz uma base criada
# naquele país nascer `confidential` sem ninguém lembrar de marcar
# (`Country#default_sensitivity`, ver docs/vocabulary.md).
#
# A lista está VAZIA de propósito: hoje nenhum país está marcado. Quem decide
# quais são é a equipe, com quem conhece o campo — não um índice de terceiro,
# não um agente, não quem escreveu este arquivo. Marcar um país é trocar o
# `false` da linha dele, e a decisão precisa de dono e de data registrados na
# própria issue que a tomar.
#
# `grep -c '^- .*true' db/vocabulary/countries.yml` responde, a qualquer
# momento, o tamanho exato da curadoria já feita.
#
# Códigos entre aspas porque `NO` (Noruega) e afins são booleanos em YAML.
