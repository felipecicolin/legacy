# Regras de estilo do projeto.
#
# Não existe `.rubocop_todo.yml` aqui, e isso é política, não acaso: o projeto
# nasceu limpo e a única forma sustentável de continuar assim é nunca abrir a
# porta da dívida. Ofensa se conserta, não se cataloga — ver AGENTS.md.

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-capybara
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec
  - rubocop-factory_bot
  - rubocop-rspec_rails
  - rubocop-thread_safety
  - rubocop-view_component
  - rubocop-i18n

AllCops:
  NewCops: enable
  # Exigido pelos cops de ViewComponent 0.7+: eles detectam a classe pela
  # ancestralidade, e isso depende do índice de projeto do rubocop.
  UseProjectIndex: true
  Exclude:
    - bin/**/*
    - db/**/*
    - tmp/**/*
    - node_modules/**/*
    - vendor/**/*
  DisplayCopNames: true
  DisplayStyleGuide: true
  CacheRootDirectory: tmp

# — Metrics ————————————————————————————————————————————————

Metrics/MethodLength:
  Max: 7

Metrics/AbcSize:
  Max: 15

Metrics/CyclomaticComplexity:
  Max: 6

Metrics/PerceivedComplexity:
  Max: 6

Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: true
  Exclude:
    # A lista de kwargs de um ViewComponent É a API pública dele (variant,
    # size, type, disabled, href, classes, data). Espremê-la num objeto de
    # valor só empurraria a mesma lista para o call site, com ergonomia pior.
    - "app/components/**/*"

Metrics/ClassLength:
  Max: 120

Metrics/ModuleLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - spec/**/*.rb
    - Rakefile
    - lib/tasks/**/*.rb
    - config/**/*.rb

Layout/LineLength:
  Max: 120

# — Style ——————————————————————————————————————————————————

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/CollectionMethods:
  Enabled: true

Style/ReturnNil:
  Enabled: true

Style/ImplicitRuntimeError:
  Enabled: true

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

# — Lint ———————————————————————————————————————————————————

# Lint/ConstantResolution: too noisy in Rails apps (flags Rails, RSpec, ActiveRecord
# at every top-level reference). Disabled.
Lint/ConstantResolution:
  Enabled: false

Lint/NumberConversion:
  Enabled: false

# — Naming —————————————————————————————————————————————————

Naming/RescuedExceptionsVariableName:
  PreferredName: error

Naming/VariableNumber:
  EnforcedStyle: snake_case

# — i18n ———————————————————————————————————————————————————

# rubocop-i18n in Rails-i18n style: catches user-facing string literals
# that should go through `t()` / `I18n.t()` / model-error i18n keys.
# GetText style is unused.
I18n/RailsI18n:
  Enabled: true
I18n/GetText:
  Enabled: false

I18n/RailsI18n/DecorateString:
  Enabled: true
  Exclude:
    - spec/**/*
    - config/**/*
    - db/**/*
    - lib/tasks/**/*

# — Rails ——————————————————————————————————————————————————

Rails/Date:
  Enabled: true

Rails/TimeZone:
  Enabled: true

Rails/I18nLocaleTexts:
  Enabled: true

Rails/I18nLazyLookup:
  Enabled: true

# O cop mira o finder dinâmico do Active Record (`find_by_nome`), que resolve
# coluna por method_missing. `find_by_password_reset_token` não é isso: é um
# método real, gerado pelo `generates_token_for` que o `has_secure_password`
# instala, e o token não é coluna nenhuma. A sugestão do cop
# (`find_by(password_reset_token: …)`) consultaria uma coluna que não existe.
Rails/DynamicFindBy:
  AllowedMethods:
    - find_by_password_reset_token
    - find_by_password_reset_token!

Rails/WhereExists:
  Enabled: true

Rails/WhereNot:
  Enabled: true

Rails/WhereEquals:
  Enabled: true

Rails/Pluck:
  Enabled: true

Rails/PluckInWhere:
  Enabled: true

Rails/FindEach:
