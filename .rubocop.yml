# — RSpec ——————————————————————————————————————————————————

RSpec/MultipleExpectations:
  Enabled: true
  Max: 5

RSpec/DescribeClass:
  Exclude:
    - spec/system/**/*.rb
    - spec/requests/**/*.rb

RSpec/ImplicitSubject:
  EnforcedStyle: single_statement_only

RSpec/MultipleMemoizedHelpers:
  Max: 7

RSpec/SharedExamples:
  Enabled: false

RSpec/AnyInstance:
  Enabled: false

RSpec/VerifiedDoubleReference:
  Enabled: true

RSpec/LetSetup:
  Enabled: true

RSpec/InstanceVariable:
  Enabled: true

RSpec/SubjectStub:
  Enabled: true

RSpec/MessageSpies:
  EnforcedStyle: receive

RSpec/NestedGroups:
  Max: 4

RSpec/ContextWording:
  Prefixes: [when, with, without, if, unless, for]

RSpec/NamedSubject:
  Enabled: true

RSpec/NoExpectationExample:
  Enabled: true

RSpec/PredicateMatcher:
  Enabled: true

RSpec/EmptyLineAfterFinalLet:
  Enabled: true

RSpec/EmptyLineAfterHook:
  Enabled: true

RSpec/IncludeExamples:
  Enabled: true

RSpec/SpecFilePathFormat:
  Enabled: true

RSpec/SpecFilePathSuffix:
  Enabled: true

RSpec/MetadataStyle:
  Enabled: true

RSpec/EmptyMetadata:
  Enabled: true

RSpec/SortMetadata:
  Enabled: true

RSpec/DuplicatedMetadata:
  Enabled: true

RSpec/IndexedLet:
  Enabled: true

RSpec/PendingWithoutReason:
  Enabled: true

RSpec/RedundantAround:
  Enabled: true

RSpec/SkipBlockInsideExample:
  Enabled: true

RSpec/SubjectDeclaration:
  Enabled: true

RSpec/RemoveConst:
  Enabled: true

RSpec/ExampleLength:
  CountAsOne: ["array", "hash", "heredoc"]
  Exclude:
    - spec/system/**/*.rb
    - spec/requests/**/*.rb

# — FactoryBot ————————————————————————————————————————————

FactoryBot/ConsistentParenthesesStyle:
