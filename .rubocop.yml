FactoryBot/FactoryAssociationWithStrategy:
  Enabled: true

FactoryBot/FactoryNameStyle:
  Enabled: true

FactoryBot/ExcessiveCreateList:
  Enabled: true

FactoryBot/RedundantFactoryOption:
  Enabled: true

FactoryBot/SyntaxMethods:
  Enabled: true

# — ViewComponent ————————————————————————————————————————
#
# Todos os cops vêm ligados por padrão e a detecção da classe sai da
# ancestralidade (`AllCops/UseProjectIndex` acima). Duas exceções:

# Este cop acusa QUALQUER componente que herde de outro componente — e
# `ApplicationComponent` é um componente. Como todo componente do projeto herda
# dela (é o padrão da própria gem, o mesmo `ApplicationRecord` de sempre), o
# cop dispara em 100% dos arquivos e não distingue "herda a base abstrata do
# app" de "herda outro componente concreto", que é o que ele quer coibir.
ViewComponent/PreferComposition:
  Enabled: false

ViewComponent/TestRenderedOutput:
  Exclude:
    # ApplicationComponent é abstrata: não tem template e não renderiza nada.
    # O que ela tem são os helpers (class_merge, validate_inclusion!,
    # stimulus_controller), e é isso que o spec dela testa. Para os
    # componentes concretos o cop continua valendo.
    - "spec/components/application_component_spec.rb"
