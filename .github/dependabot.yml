version: 2

updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: daily
      time: "07:00"
      timezone: America/Sao_Paulo

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "07:00"
      timezone: America/Sao_Paulo

  # O package.json existe só para as regras customizadas do herb
  # (.herb/rules/*.mjs). Nada daqui vai para o navegador.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "07:00"
      timezone: America/Sao_Paulo
