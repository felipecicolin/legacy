name: CI

on:
  pull_request:
    # `ready_for_review` porque os jobs abaixo se pulam enquanto o PR é
    # rascunho; sem esse tipo, tirar do rascunho não dispararia nada e o PR
    # ficaria sem CI até o push seguinte.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref != '' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `scan_ruby` e `scan_js` eram dois jobs no template do Rails. O scan_js
  # gastava ~80s montando o Ruby para rodar 2s de `importmap audit`: um runner
  # faturado por inteiro, e o trabalho de verdade cabia numa piscada do
  # vizinho, que já tem o mesmo Ruby montado. Aqui dividem o runner.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # O libpq-dev é para o caso de MISS no cache de gems: sem ele o
      # `bundle install` não compila a extensão nativa da pg e o job morre no
      # setup. E o miss não é hipotético — todo PR do dependabot muda o
      # Gemfile.lock, que entra na chave do cache. O job de origem não passava
      # nada aqui e dependia de o warm_gem_cache já ter rodado.
      - name: Setup shared Ruby environment
        uses: ./.github/actions/setup-ruby-environment
        with:
          system-dependencies: libpq-dev

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      # Daqui para baixo, todo passo roda mesmo se um anterior falhou, para que
      # um commit resolva tudo o que os scanners têm a dizer em vez de um item
      # por push.
      - name: Scan for known security vulnerabilities in gems used
        if: ${{ !cancelled() }}
        run: bin/bundler-audit

      - name: Scan for security vulnerabilities in JavaScript dependencies
        if: ${{ !cancelled() }}
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
      # O `bin/components_registry --check` sobe o Rails para introspectar as
      # classes de componente. Não toca no banco — só o eager_load — então
      # este job não precisa do serviço Postgres. `test` e não `development`
      # para não carregar Lookbook e Bullet à toa.
      RAILS_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup shared Ruby environment
        uses: ./.github/actions/setup-ruby-environment
        with:
          # libvips porque o `bin/components_registry --check` sobe o Rails, e
          # o Active Storage carrega o transformer de vips no boot.
          system-dependencies: libpq-dev libvips

      # O Node existe neste repo por um motivo só: as regras customizadas do
      # herb são `.herb/rules/*.mjs`. Não há build de JS — o navegador é servido
      # por importmap + propshaft, o CSS sai do binário do tailwindcss-rails, e
      # o bin/stimulus_lint é Ruby puro.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node deps (herb custom rules)
        run: npm ci

      # A chave termina em `run_id` no branch default e em `default` fora dele.
      # Como este workflow só roda em `pull_request`, o primeiro ramo nunca
      # acontece aqui — quem grava sob ele é o warm_gem_cache.yml, rodando no
      # main, e é por isso que os `restore-keys` por prefixo abaixo têm o que
      # encontrar.
      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      # Todo passo daqui para baixo roda mesmo se um anterior falhou: um push
      # passa a devolver tudo o que os linters têm a dizer, em vez de uma coisa
      # de cada vez.
      - name: Lint Ruby code for consistent style
        run: bin/rubocop --parallel -f github

      - name: Check for code smells
        if: ${{ !cancelled() }}
        run: bundle exec reek app/ lib/

      # O repositório INTEIRO, não só os arquivos que o PR toca. Isso só é
      # possível porque o projeto nasceu limpo — não há dívida herdada para
      # reprovar o autor de um PR que não a criou.
      - name: Lint HTML+ERB templates
        if: ${{ !cancelled() }}
        run: bin/herb_lint

      - name: Validate SVG icon catalog
        if: ${{ !cancelled() }}
        run: bin/icon_lint

      - name: Lint Stimulus controller files
        if: ${{ !cancelled() }}
        run: bin/stimulus_lint

      - name: Check translation hygiene (missing/unused/normalized)
        if: ${{ !cancelled() }}
        run: bin/i18n-tasks health

      - name: Enforce ViewComponent sidecar i18n structure
        if: ${{ !cancelled() }}
        run: bin/i18n_sidecar_lint

      # O registry e o public/llms.txt são gerados a partir das classes de
      # componente. Se saírem de sincronia, um agente que leia o llms.txt
      # recebe uma API que não existe mais — é o tipo de arquivo que só vale
      # se for verdade.
      - name: Verify component registry is up to date
        if: ${{ !cancelled() }}
        run: bin/components_registry --check

      # Por último, porque é o que falha quando alguém silenciou qualquer um
      # dos passos acima em vez de consertá-lo.
      - name: Guard against new rubocop/reek directives
        if: ${{ !cancelled() }}
        run: bin/directive_guard

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft == false

    env:
      RAILS_ENV: test
      COVERAGE: "1"
      CI: "true"
      CI_NODE_INDEX: 1
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    services:
      postgres:
        # Preso na major, não em `latest`: o clone por TEMPLATE abaixo depende
        # do comportamento desta imagem, e uma tag móvel troca a camada de
        # banco sem nenhum commit. É a 18 porque é o que o dev roda localmente.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # `--health-interval=10s` (o default) faz o runner esperar ~13s em
        # "Waiting for all services to be ready": o Postgres aceita conexão em
        # ~2s, mas o primeiro healthcheck só rodaria aos 10s. Com 2s o runner o
        # encontra pronto no primeiro ou segundo poll.
        options: --health-cmd="pg_isready" --health-interval=2s --health-timeout=5s --health-retries=15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup shared Ruby environment
        uses: ./.github/actions/setup-ruby-environment
        with:
          system-dependencies: libpq-dev libvips

      # Uma carga de schema, e o Postgres clona o resto. Um segundo
      # `db:test:prepare` subiria o Rails de novo só para reproduzir o mesmo
      # schema no banco do segundo processo.
      - name: Setup parallel test databases
        run: |
          bin/rails db:test:prepare
          psql -q -c "CREATE DATABASE legacy_test2 TEMPLATE legacy_test"

      - name: Verify schema.rb is in sync with migrations
        run: |
          bin/rails db:abort_if_pending_migrations
          if ! git diff --exit-code db/schema.rb; then
            echo "::error::db/schema.rb is out of sync with migrations. Run bin/rails db:migrate locally and commit the result."
            exit 1
          fi

      - name: Check database consistency
        run: bundle exec database_consistency

      # `app/assets/builds/` é gitignorado, então o CSS não existe num clone
      # limpo. Sem este passo, o primeiro spec que renderizar o layout morre
      # num Propshaft::MissingAssetError — e o erro apontaria para o spec, não
      # para a causa. O spec de tokens depende deste passo por inteiro: ele
      # pergunta ao navegador que cor cada utility resolveu, e sem CSS
      # compilado a resposta seria "transparente" para todas.
      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      # O chromedriver já vem na imagem do runner, mas fora do PATH. Sem esta
      # linha o Selenium Manager sai para a rede baixar um segundo, idêntico —
      # que é lento e é mais uma dependência externa entre a CI e o verde.
      #
      # O `test -n` não é paranoia: `CHROMEWEBDRIVER` é variável da imagem, não
      # do GitHub. Se a imagem parar de defini-la, um `echo ""` não falha, não
      # acrescenta nada ao PATH, e a suíte volta a baixar driver pela rede em
      # silêncio — o comentário acima viraria mentira sem nada ficar vermelho.
      - name: Put the runner's chromedriver on PATH
        run: |
          test -n "$CHROMEWEBDRIVER" || {
            echo "::error::CHROMEWEBDRIVER is unset — the runner image no longer ships chromedriver."
            exit 1
          }
          echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"

      # `-n 2` porque o runner padrão tem 2 cores (medido: `nproc=2`, 7,9 GB).
      # Quando a suíte crescer a ponto de um runner não dar conta, a volta para
      # a matriz de shards do repositório de origem é um diff pequeno: um
      # `strategy.matrix` com `node_index`/`groups` e `--only-group` aqui.
      #
      # `--format progress` porque o .rspec pede `documentation`, e dois
      # processos escrevendo o nome de cada exemplo afogam a falha no meio do
      # verde. A falha continua saindo inteira, com descrição e backtrace.
      - name: Run tests
        run: |
          rm -rf coverage
          bundle exec parallel_rspec spec/ -n 2 -o "--format progress"

      - name: Upload coverage resultset
        uses: actions/upload-artifact@v7
        with:
          name: coverage-1
          path: coverage/.resultset.json
          if-no-files-found: error
          include-hidden-files: true

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup shared Ruby environment
        uses: ./.github/actions/setup-ruby-environment

      - name: Download coverage resultsets
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: tmp/coverage

      - name: Collate coverage and enforce 100/100
        run: ruby script/verify_coverage.rb
